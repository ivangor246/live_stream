[project]
name = "live-stream-backend"
version = "0.1.0"
description = "FastAPI backend for Live Stream Monitor"
authors = [{ name = "Live Stream Monitor" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi>=0.128.8,<1.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "uvicorn[standard]>=0.40.0,<1.0.0",
]

[tool.poetry]
packages = [
    { include = "app", from = "src" },
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.0"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["C", "E", "F", "W"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
