# Enable the media protocols used by the self-hosted dashboard.
api: yes
apiAddress: 0.0.0.0:9997

# Delegate media authentication to the backend.
authMethod: http
authHTTPAddress: http://backend:3000/api/media/auth
authHTTPExclude:
  - action: api

rtmp: yes
rtmpAddress: :1935
hls: yes
hlsAddress: :8888
webrtc: yes
webrtcAddress: :8889
playback: yes
playbackAddress: :9996

pathDefaults:
  # Store each managed stream in the persistent recordings volume.
  record: yes
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 1h
  recordDeleteAfter: 30d

# The backend creates paths before a stream starts.
paths: {}
