services:
  mediamtx:
    image: bluenviron/mediamtx:1
    volumes:
      - ./server/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "${MEDIA_RTMP_PORT:-1935}:1935"
      - "${MEDIA_HLS_PORT:-8888}:8888"
      - "${MEDIA_WEBRTC_PORT:-8889}:8889"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-live_stream}
      POSTGRES_USER: ${POSTGRES_USER:-live_stream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-live_stream}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./server
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://live_stream:live_stream@postgres:5432/live_stream}
      MEDIA_RTMP_URL: ${MEDIA_RTMP_URL:-rtmp://localhost:1935}
      MEDIA_HLS_URL: ${MEDIA_HLS_URL:-http://localhost:8888}
      MEDIA_WEBRTC_URL: ${MEDIA_WEBRTC_URL:-http://localhost:8889}
    depends_on:
      mediamtx:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ./client
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres-data:
