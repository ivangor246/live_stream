services:
  mediamtx:
    image: bluenviron/mediamtx:1
    environment:
      MTX_AUTHMETHOD: http
      MTX_AUTHHTTPADDRESS: ${MEDIA_AUTH_URL:-http://backend:3000/api/media/auth}
      MTX_PATHDEFAULTS_RECORDDELETEAFTER: ${MEDIA_RECORD_RETENTION:-30d}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server/mediamtx.yml:/mediamtx.yml:ro
      - media-recordings:/recordings
    ports:
      - "${MEDIA_RTMP_BIND_ADDRESS:-0.0.0.0}:${MEDIA_RTMP_PORT:-1935}:1935"
      - "${MEDIA_HLS_BIND_ADDRESS:-0.0.0.0}:${MEDIA_HLS_PORT:-8888}:8888"
      - "${MEDIA_WEBRTC_BIND_ADDRESS:-0.0.0.0}:${MEDIA_WEBRTC_PORT:-8889}:8889"
      - "127.0.0.1:${MEDIA_API_PORT:-9997}:9997"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-live_stream}
      POSTGRES_USER: ${POSTGRES_USER:-live_stream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-live_stream}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./server
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://live_stream:live_stream@postgres:5432/live_stream}
      MEDIA_RTMP_URL: ${MEDIA_RTMP_URL:-rtmp://localhost:1935}
      MEDIA_HLS_URL: ${MEDIA_HLS_URL:-http://localhost:8888}
      MEDIA_WEBRTC_URL: ${MEDIA_WEBRTC_URL:-http://localhost:8889}
      MEDIA_PLAYBACK_API_URL: ${MEDIA_PLAYBACK_API_URL:-http://mediamtx:9996}
      MEDIA_API_URL: ${MEDIA_API_URL:-http://mediamtx:9997}
      MEDIA_API_TIMEOUT: ${MEDIA_API_TIMEOUT:-2.0}
      MEDIA_AUTH_SECRET: ${MEDIA_AUTH_SECRET:-local-development-media-secret}
      MEDIA_AUTH_TOKEN_TTL_SECONDS: ${MEDIA_AUTH_TOKEN_TTL_SECONDS:-3600}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-live_stream_session}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-14}
      AUTH_INVITE_TTL_HOURS: ${AUTH_INVITE_TTL_HOURS:-168}
      STREAM_INVITE_TTL_HOURS: ${STREAM_INVITE_TTL_HOURS:-168}
      AUTH_SECURE_COOKIE: ${AUTH_SECURE_COOKIE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mediamtx:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ./client
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-8080}:80"

  recordings-maintenance:
    image: alpine:3.22
    profiles: ["maintenance"]
    volumes:
      - media-recordings:/recordings
    entrypoint: ["/bin/sh", "-c"]

volumes:
  postgres-data:
  media-recordings:
