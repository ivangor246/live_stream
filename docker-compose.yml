services:
  backend:
    build:
      context: ./server
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    build:
      context: ./client
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
