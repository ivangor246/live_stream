name: Release container images

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  validate-release-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - id: version
        name: Validate semantic version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          if [ "$RELEASE_TAG" = "$version" ]; then
            echo "Release tags must start with v" >&2
            exit 1
          fi

          build_metadata=""
          if [[ "$version" == *+* ]]; then
            build_metadata="${version#*+}"
            version="${version%%+*}"
            if [ -z "$build_metadata" ] || [[ "$build_metadata" == *+* ]]; then
              echo "Invalid build metadata" >&2
              exit 1
            fi
          fi

          pre_release=""
          if [[ "$version" == *-* ]]; then
            pre_release="${version#*-}"
            version="${version%%-*}"
            if [ -z "$pre_release" ]; then
              echo "Invalid prerelease identifier" >&2
              exit 1
            fi
          fi

          IFS=. read -r -a core_identifiers <<< "$version"
          if [ "${#core_identifiers[@]}" -ne 3 ]; then
            echo "A release tag must contain major, minor, and patch numbers" >&2
            exit 1
          fi

          for identifier in "${core_identifiers[@]}"; do
            if ! [[ "$identifier" =~ ^(0|[1-9][0-9]*)$ ]]; then
              echo "Invalid core version identifier" >&2
              exit 1
            fi
          done

          validate_identifiers() {
            local identifiers="$1"
            local reject_leading_zeroes="$2"
            local identifier
            local -a parsed_identifiers

            if [[ "$identifiers" == .* || "$identifiers" == *. || "$identifiers" == *..* ]]; then
              return 1
            fi

            IFS=. read -r -a parsed_identifiers <<< "$identifiers"
            for identifier in "${parsed_identifiers[@]}"; do
              if ! [[ "$identifier" =~ ^[0-9A-Za-z-]+$ ]]; then
                return 1
              fi

              if [ "$reject_leading_zeroes" = true ] && [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                return 1
              fi
            done
          }

          if [ -n "$pre_release" ] && ! validate_identifiers "$pre_release" true; then
            echo "Invalid prerelease identifier" >&2
            exit 1
          fi

          if [ -n "$build_metadata" ] && ! validate_identifiers "$build_metadata" false; then
            echo "Invalid build metadata" >&2
            exit 1
          fi

          echo "Validated release tag: $RELEASE_TAG"

  publish:
    name: Publish ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs: validate-release-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./server
          - component: frontend
            context: ./client
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Live Stream Monitor ${{ matrix.component }} image
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
