name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'poetry==2.1.3'
      - run: poetry install --no-interaction
      - run: poetry run ruff check src migrations
      - run: poetry run python -m compileall -q src/app
      - run: poetry run python -c 'from app.main import app; print(app.title)'

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: docker compose up --build -d
      - name: Wait for the backend
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:3000/api/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Check frontend proxy and service status
        run: |
          curl --fail --silent --show-error http://localhost:8080/api/health
          curl --fail --silent --show-error http://localhost:8080/api/status
      - name: Show failed service logs
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans
