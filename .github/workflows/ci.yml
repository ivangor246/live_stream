name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: pip install 'poetry==2.1.3'
      - run: poetry install --no-interaction
      - run: poetry run ruff check src migrations tests
      - run: poetry run python -m compileall -q src/app
      - run: poetry run python -c 'from app.main import app; print(app.title)'
      - run: poetry run python -m unittest discover -s tests

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start services
        run: docker compose up --build -d
      - name: Wait for the backend
        run: |
          attempt=0
          until curl --fail --silent --show-error http://localhost:3000/api/ready; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 30 ]; then
              docker compose logs
              exit 1
            fi
            sleep 2
          done
      - name: Check frontend proxy and service status
        run: |
          curl --fail --silent --show-error http://localhost:8080/api/health
          curl --fail --silent --show-error http://localhost:8080/api/status
      - name: Show failed service logs
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans
