services:
  mediamtx:
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${LIVE_STREAM_DOMAIN}
    ports:
      - "${MEDIA_WEBRTC_ICE_PORT:-8189}:8189/udp"

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - frontend
      - mediamtx
    environment:
      LIVE_STREAM_DOMAIN: ${LIVE_STREAM_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
